# Novedades de cada versión del informe. Se edita a mano en cada evolutivo del proyecto:
# añadir una entrada NUEVA ARRIBA (la primera es la más reciente). Texto llano, sin jerga.
# Campos: version, date (AAAA-MM-DD), title, items (lista de frases cortas).
entries:
  - version: "0.14"
    date: 2026-10-23
    title: El precio del día del cierre apenas ayuda
    items:
      - "Se ha probado el precio de la electricidad del día en que se cierra la previsión, que se publica la víspera y siempre llega a tiempo. Se resume en cuatro datos: horas con precio negativo, mínimo, media y diferencia entre el más alto y el más bajo."
      - "Con ese precio el error del modelo baja un 0,6 %: de 1.061 a 1.054 MW. En 13 de los 22 meses evaluados mejora y en 9 empeora, y repitiendo el cálculo con otros días el resultado puede no ser mejora. Es demasiado poco para fiarse."
      - "Los días con precio negativo, que son los de más error, tampoco mejoran más que los demás."
      - "Por eso el modelo no lo usa por ahora. El dato queda guardado y comprobado, y se podrá activar más adelante si compensa."
      - "No se usa el precio del día siguiente: llega tarde la mitad de los días. Una prueba automática falla si alguno se cuela."
  - version: "0.13"
    date: 2026-10-23
    title: La prueba se repite con los 30 meses de historia
    items:
      - "La prueba del modelo ya no usa solo 13 meses: se ha rehecho con todo el histórico, de abril de 2024 a julio de 2026. Ahora incluye el invierno 2024/25, que antes no se había visto."
      - "La prueba pasa de 8 a 22 meses evaluados uno a uno (de octubre de 2024 a julio de 2026). Cada mes se evalúa con un modelo que solo ha visto los meses anteriores."
      - "El modelo de árboles mejora con más historia: en el mismo periodo de antes (diciembre 2025 a julio 2026) su error baja de 1.233 a 1.129 MW. Sigue por detrás del operador (931 MW en ese periodo) y ya supera a la curva de potencia."
      - "Con los 22 meses, el modelo de árboles se equivoca 1.061 MW de media y el operador 877 MW: un 21 % más. Con el rango calibrado, la producción real cae dentro del rango previsto el 79,5 % del tiempo, dentro de la banda exigida."
      - "La racha de viento no existe antes del 13 de noviembre de 2024. Se probó con datos reales: dejar el hueco vacío o quitar la variable da el mismo resultado (la diferencia es menor del 1 %), así que se deja vacío y el modelo sabe que falta."
  - version: "0.12"
    date: 2026-10-23
    title: El precio de mañana llega demasiado justo
    items:
      - "El precio del día siguiente solo estuvo publicado antes del cierre la mitad de los días. Un día llegó a las 21:00 de Madrid, así que el modelo no lo usará."
      - "La previsión del operador llega siempre hacia las 19:00 de Madrid, cuatro horas después del cierre. Solo sirve para compararse con ella."
      - "El precio de hoy sí está siempre a tiempo, así que se probará como pista más adelante."
  - version: "0.11"
    date: 2026-10-22
    title: Un día visto por cada modelo
    items:
      - "Nuevo gráfico en «¿Mejora el pronóstico?»: elija un mes y un tipo de día (con mucho viento, típico o tranquilo) y verá lo que se produjo de verdad junto a lo que habría dicho cada modelo con los datos que tenía al cierre."
      - "Se ve de un vistazo cómo piensa cada uno: «repetir lo último» es una línea plana desde el último dato publicado, la media histórica es lo normal para esa hora y mes, y los que leen el viento siguen sus subidas y bajadas."
      - "Debajo, cuánto se equivocó cada modelo ese día, de mejor a peor. Cada modelo nuevo que probemos aparecerá aquí para compararlo con los anteriores."
  - version: "0.10"
    date: 2026-10-22
    title: Nueva referencia, «repetir lo último conocido», sin hacer trampa
    items:
      - "Ya sabemos con cuánto retraso publica el operador la producción real: lo normal es una media hora. El 22 de octubre se atascó justo alrededor del cierre y llegó a casi tres horas."
      - "Con eso se ha montado la referencia más sencilla: repetir para mañana la última producción que ya estaba publicada tres horas antes del cierre. El margen cubre un atasco como el del 22 de octubre y apenas empeora el resultado."
      - "Como se esperaba, repetir lo último conocido sirve de poco para el día siguiente: se equivoca casi cuatro veces más que el operador, en la línea de la media histórica."
      - "Con esta, ya están las cuatro referencias del plan: operador, media histórica, curva de potencia y «repetir lo último conocido». El siguiente paso es la prueba del primer modelo frente a las cuatro."
  - version: "0.9"
    date: 2026-10-22
    title: El servidor sigue encendido y se guarda copia de todo lo que archiva
    items:
      - "El servidor seguirá funcionando hasta la siguiente fase: es el único sitio que guarda cada hora, sin huecos, las correcciones que publica el operador y la hora a la que publica cada dato. Si se perdieran, no habría forma de recuperarlas."
      - "Cada día se copia todo lo que guarda el servidor a un equipo propio. Lo borrado en el servidor nunca se borra en la copia."
      - "El servidor tiene ya la versión que reintenta sola los rechazos puntuales del operador, también los cortes de su pasarela vistos hoy."
      - "Desde hoy se anota cada hora hasta qué cuarto de hora hay producción real publicada: hacia una hora de retraso. Con una semana de medidas se podrá montar la referencia «repetir lo último conocido» sin hacer trampa."
      - "Primeras medidas de la hora de publicación (5 días, provisionales): los precios del día siguiente salen casi siempre antes del cierre, hacia las 14:00 de Madrid; la previsión del propio operador llega a las 19:00, cuatro horas después del cierre."
  - version: "0.8"
    date: 2026-10-22
    title: Primera puerta superada, una semana de descarga diaria sin fallos
    items:
      - "Del 16 al 22 de octubre el servidor descargó cada día, sin ayuda, la previsión meteorológica y los datos del operador. Siete de siete días sin fallos: la primera puerta del calendario (G0) queda superada."
      - "La previsión llegó todos los días a la misma hora (entre las 10:15 y las 10:18, hora de Madrid) y siempre con unas 4 h 40 min de margen antes del cierre de la liga."
      - "Las consultas horarias al operador fallaron 4 veces en la semana por un error suyo; en todos los casos se recuperaron solas a la hora siguiente."
      - "La prueba (registro de ejecuciones, horas de llegada e informes de calidad) está guardada fuera del servidor."
  - version: "0.7"
    date: 2026-10-21
    title: El rango ya acierta lo que promete y el archivo meteorológico está completo
    items:
      - "El rango del modelo se corrige cada día con los errores de los dos meses anteriores (solo los que ya se conocían antes del cierre). Antes acertaba el 64 % de las veces; ahora el 80 %, justo lo buscado, y la nota que mide la calidad del rango mejora un 4 %."
      - "Por meses todavía oscila (entre el 63 % y el 91 %): enero se queda corto y febrero y mayo se pasan. Se revisará cuando el modelo esté afinado."
      - "El archivo de previsión meteorológica ya empieza en abril de 2024: dos años y medio, 934 días, todos completos y revisados sin ningún hueco."
      - "Las descargas de días antiguos ya no pueden pisarse con la descarga diaria aunque coincidan en el tiempo."
      - "Una prueba nueva recorre toda la cadena, desde los datos de origen hasta las métricas, con datos de mentira. Se ejecuta sola en cada cambio del código."
  - version: "0.6"
    date: 2026-10-21
    title: Primer modelo propio, todavía sin afinar
    items:
      - "Primer modelo de verdad: aprende del viento previsto en cada grupo de parques y da, para cada cuarto de hora, un valor central y un rango donde debería caer la producción."
      - "Se ha probado mes a mes, como las referencias: hoy queda algo por detrás de la curva de potencia (un 3 % más de error) y lejos del operador. Es lo esperado sin afinar; el ajuste y la corrección del rango vienen en los próximos pasos."
      - "Su rango es demasiado estrecho: acierta el 64 % de las veces en vez del 80 % buscado."
      - "Cada prueba queda guardada en un registro de experimentos, con la versión exacta de los datos que usó."
      - "Cada hora se apunta además hasta qué cuarto de hora hay producción real publicada. Servirá para la referencia «repetir lo de ayer» sin hacer trampa."
      - "Las comprobaciones automáticas (incluida la que impide mirar al futuro) se ejecutarán en cada cambio del código."
  - version: "0.5"
    date: 2026-10-20
    title: La descarga automática aguanta mejor los fallos
    items:
      - "Si el ordenador no tiene conexión cuando toca descargar (por ejemplo, recién encendido), ahora espera hasta 10 minutos a que vuelva la red en lugar de fallar."
      - "Si una descarga falla, se reintenta sola unas cuantas veces antes de darla por perdida y avisar."
      - "El proveedor de precios y previsión del operador rechaza de vez en cuando una petición correcta (una o dos veces al día). Ahora se vuelve a pedir automáticamente y, si sigue fallando, queda anotado el motivo."
      - "Estos fallos no han afectado a los datos ni a la comprobación de 7 días: llevamos 5 de 7 días seguidos sin fallos."
  - version: "0.4"
    date: 2026-10-16
    title: Ya sabemos medir si el pronóstico mejora
    items:
      - "Capítulo nuevo, «¿Mejora el pronóstico?»: compara cada modelo con la previsión del operador, con una frase de veredicto, la tabla de cifras y la tendencia entre pruebas."
      - "Prueba día a día: cada mes se predice sin haberlo visto, solo con lo aprendido en los meses anteriores. El periodo reservado queda aparte y se anota cada vez que se mira."
      - "Tres referencias medidas: la media histórica por hora y mes, una curva de potencia sobre el viento previsto y el propio operador."
      - "De momento ninguna referencia supera al operador: es lo esperado, son los puntos de partida que el modelo de verdad tendrá que batir."
      - "La descarga diaria ya funciona sola: cada mañana espera a que se publique la previsión meteorológica, apunta a qué hora llegó y cuánto margen quedó antes del cierre (hoy, 4 h 41 min), y prepara los datos del día."
      - "Cada hora se consulta el precio y la previsión del operador para medir a qué hora se publican de verdad."
  - version: "0.3"
    date: 2026-10-16
    title: La tabla con la que aprenderá el modelo
    items:
      - "Ya existe la tabla de entrenamiento: una fila por cuarto de hora del día siguiente, 410 días, con el viento previsto en cada grupo de parques y la producción real que hubo."
      - "Cada dato lleva la hora a la que lo habríamos tenido de verdad. La previsión meteorológica llega hacia las 8:30 UTC, con al menos cuatro horas y media de margen antes del cierre."
      - "Una prueba automática impide usar información posterior al cierre, la producción real o la previsión del operador como pistas."
      - "Los días del cambio de hora salen con su número real de cuartos de hora: 92 en marzo y 100 en octubre."
      - "El precio del mercado queda fuera de momento: aún no hemos medido a qué hora se publica."
  - version: "0.2"
    date: 2026-10-16
    title: La previsión meteorológica por dentro
    items:
      - "Capítulo nuevo, «La previsión meteorológica, por dentro»: qué campos usamos y por qué, la malla de la zona con un día real, los plazos de cada pasada, los 51 escenarios y el viento previsto frente a la producción real."
      - "Los mapas se dibujan ahora con una proyección que conserva las proporciones: Alemania ya no sale achatada y las celdas de la rejilla se ven más altas que anchas, como en la realidad."
      - "El mapamundi se rehace con el recorrido numerado de cada fuente y un recuadro ampliado de Europa occidental; el servidor de almacenamiento está en Bilbao."
      - "Los nombres de los estados se colocan en huecos libres, sin tapar los grupos de parques."
  - version: "0.1"
    date: 2026-10-16
    title: Los datos ya están en casa y comprobados
    items:
      - "Comprobamos la fuente meteorológica (etapa 0): variables disponibles, cobertura desde abril de 2024 y la hora a la que publica cada día."
      - "Probamos la cadena completa con una semana de datos (etapa 1) y la repetimos a los 13 meses de histórico (etapa 2): todas las previsiones descargadas, guardadas y resumidas."
      - "Validación automática de la previsión meteorológica: cada día guardado supera los controles de rango, vacíos y estructura."
      - "Producción eólica real, precios y previsión del operador desde 2015, descargados de ENTSO-E y reconstruidos sin huecos."
      - "Registro oficial de aerogeneradores (MaStR): cada turbina de la zona con su potencia, posición y fecha de alta."
      - "Los 21 grupos de parques se calculan con las turbinas reales, y la previsión meteorológica ya se resume en esos puntos."
      - "Primera versión de este informe."
