# Semilla del backlog de Predico 50Hertz en GitHub (issues, sub-issues, «Blocked by» y milestones).
#
# Se carga con `uv run python scripts/sync_github_backlog.py` (idempotente: solo crea lo que falta;
# nunca edita ni cierra lo que ya existe). Tras la carga inicial (20 oct 2026) la fuente de verdad del
# trabajo pendiente es GitHub; este fichero solo sirve para sembrar trabajo nuevo en bloque.
#
# Cada issue lleva en el cuerpo la marca `<!-- backlog:<id> -->`, que el script usa para reconocerlo.
# Campos: id, title, milestone (clave de `milestones`), labels, parent (id del padre; crea el
# sub-issue), blocked_by (ids; crea la relación «Blocked by»), context, tasks, acceptance, refs.

repo: r3v1/predico

milestones:
  g0:
    title: "1 · G0 · Archivo diario estable"
    due: 2026-10-22
    description: >-
      7 días seguidos sin fallos en nwp-daily y entsoe-daily (python -m predico50hz.orchestration status).
  v01:
    title: "2 · Modelo v0.1"
    due: 2026-10-29
    description: >-
      LightGBM sin optimizar sobre los 13 meses de la etapa 2, con métricas registradas frente a las
      cuatro referencias (persistencia, climatología, curva de potencia y operador).
  g1:
    title: "3 · G1 · Histórico completo y baseline"
    due: 2026-11-05
    description: >-
      Etapa 3 completa y baseline en backtest. Puerta G1: RMSE del Q50 ≤ pronóstico del operador y
      cobertura del 80 % entre 76 y 84 %. Regla de corte: si no se supera, el inicio pasa al 1 de enero.
  v02:
    title: "4 · G2 · Modelo final v0.2 y cierre"
    due: 2026-11-12
    description: >-
      Modelo final optimizado, benchmark cerrado y puerta G2 (mejora sobre G1 confirmada en el periodo
      reservado). Informe de cierre de la Fase 1 con la decisión 1 dic / 1 ene.
  f2:
    title: "5 · Producción"
    due: 2026-11-24
    description: >-
      Definición y construcción del sistema de producción (13–24 nov): predicción diaria, envío a
      Predico, orquestación, alertas y respaldo.
  rodaje:
    title: "6 · Rodaje y liga"
    due: 2026-11-30
    description: >-
      25–30 nov: cero días perdidos y margen p95 ≥ 60 min antes del cierre. Primer mes de liga el 1 dic.
  despues:
    title: "9 · Después del 1 dic"
    description: >-
      Trabajo útil que no condiciona la entrada en liga. Aquí se mueve lo recortable si el calendario aprieta.

labels:
  "tipo:epic": {color: "5319e7", description: "Agrupa sub-issues de una misma feature"}
  "tipo:puerta": {color: "b60205", description: "Puerta de decisión del calendario (G0, v0.1, G1, G2, rodaje)"}
  "tipo:decisión": {color: "fbca04", description: "Hay que decidir algo y dejarlo escrito"}
  "tipo:bug": {color: "d73a4a", description: "Algo no funciona como debería"}
  "area:nwp": {color: "1d76db", description: "Ingesta y calidad de la previsión meteorológica (IFS ENS, enfo)"}
  "area:entsoe": {color: "0e8a16", description: "Datos de ENTSO-E: generación, precio, pronóstico del operador"}
  "area:variables": {color: "c2e0c6", description: "Tabla de variables (oro) y control de look-ahead"}
  "area:modelo": {color: "0052cc", description: "Modelos, cuantiles, calibración y optimización"}
  "area:backtest": {color: "bfdadc", description: "Marco de evaluación, métricas y referencias"}
  "area:ops": {color: "006b75", description: "Operación diaria: jobs, systemd, Docker, Hetzner"}
  "area:calidad": {color: "e4e669", description: "Tests, CI, contratos de datos y reproducibilidad"}
  "area:producción": {color: "d93f0b", description: "Sistema de producción y envío a Predico (Fase 2)"}
  "area:informe": {color: "f9d0c4", description: "Informe ejecutivo para negocio"}
  "recortable": {color: "cccccc", description: "Primero en moverse si el calendario aprieta (ADR 0006)"}
  "externo": {color: "000000", description: "Depende de un tercero"}

issues:
  # ── G0 · Archivo diario estable ─────────────────────────────────────────────────────────────
  - id: g0
    title: "G0: 7 días seguidos de archivo diario sin fallos"
    milestone: g0
    labels: ["tipo:puerta", "area:ops"]
    context: >-
      Primera puerta del calendario. Demuestra que la descarga diaria de la previsión meteorológica
      (`nwp-daily`) y el archivo de ENTSO-E (`entsoe-daily`) funcionan solos, sin intervención, durante
      una semana completa. Se comprueba en la VM de Hetzner con Docker, donde un día sin ejecución cuenta
      como fallo. A 20 oct la racha va en 5/7 (16–20 oct en `ok`) y el margen de la NWP ronda los 282 min.
      Los fallos puntuales de `entsoe-hourly` (HTTP 400 de ENTSO-E, recuperados a la hora siguiente) no
      cuentan para G0.
    tasks:
      - "Racha 7/7 en `status` del servidor"
      - "Evidencia exportada y archivada"
      - "README e informe ejecutivo actualizados con G0 superada"
    acceptance:
      - "`python -m predico50hz.orchestration status` en el servidor muestra `G0 … superada` con racha 7/7"
    refs:
      - "`docs/f1.5-f2.7-operations.md` §8 (puerta G0) y §10 (despliegue en Hetzner)"
      - "ADR 0005"

  - id: ops-watch
    title: "Vigilar la racha de G0 el 21 y 22 de octubre sin tocar el servidor"
    milestone: g0
    labels: ["area:ops"]
    parent: g0
    context: >-
      Faltan dos días. Cualquier despliegue o reinicio del contenedor a mitad de la racha añade riesgo
      sin aportar nada a G0, así que el servidor no se toca hasta que la puerta cierre.
    tasks:
      - "Consultar `status` cada mañana tras la ventana de `nwp-daily` (≈ 08:20 UTC) y de `entsoe-daily` (06:00 UTC)"
      - "Si algún job falla: diagnóstico de solo lectura (logs del contenedor, `runs.jsonl`) y runbook `docs/runbooks/nwp-no-llega.md`"
      - "No reconstruir la imagen ni reiniciar el contenedor hasta cerrar G0"
    acceptance:
      - "Racha 7/7 o, si se rompe, causa documentada y nueva fecha estimada de G0"
    refs:
      - "`docs/runbooks/nwp-no-llega.md`"

  - id: ops-export
    title: "Exportar y archivar la evidencia de G0"
    milestone: g0
    labels: ["area:ops", "area:informe"]
    parent: g0
    blocked_by: [ops-watch]
    context: >-
      Al cerrar G0 hay que guardar la prueba (estado, `runs.jsonl`, disponibilidad de la NWP, informes de
      validación) antes de tocar nada en la VM.
    tasks:
      - "`python -m predico50hz.orchestration export` en el servidor y copiar el `.tar.gz` a local / NAS"
      - "Cerrar el issue de la puerta G0 con la fecha y la ruta de la evidencia"
      - "Entrada nueva en `report/changelog.yaml`, revisar `report/insights.yaml` y regenerar el informe"
    acceptance:
      - "El tarball de la evidencia está fuera de la VM y referenciado en `docs/f1.5-f2.7-operations.md` §11"
    refs:
      - "`docs/f1.5-f2.7-operations.md` §11 (`export`)"

  # ── Operación diaria tras G0 ──────────────────────────────────────────────────────────────
  - id: ops
    title: "Operación diaria tras G0"
    milestone: v01
    labels: ["tipo:epic", "area:ops"]
    context: >-
      Lo pendiente de la operación diaria una vez demostrada G0: llevar al servidor los arreglos del 20 oct,
      decidir el papel de la VM de Hetzner y mejorar el diagnóstico de fallos.
    tasks:
      - "Sub-issues de esta épica"

  - id: ops-deploy
    title: "Desplegar en Hetzner los arreglos de operación del 20 de octubre"
    milestone: v01
    labels: ["area:ops", "area:entsoe"]
    parent: ops
    blocked_by: [ops-export]
    context: >-
      El 20 oct se arregló en local el HTTP 400 intermitente de ENTSO-E (el cliente lo reintenta hasta 2
      veces y el error final incluye el `<Reason>`). El servidor sigue con el código anterior. La espera de
      red y los reintentos de systemd solo aplican al portátil.
    tasks:
      - "Actualizar el código en la VM y reconstruir la imagen (`docker/compose.yaml`)"
      - "Comprobar que el contenedor arranca y que el siguiente `entsoe-hourly` sale `ok`"
      - "A la semana: contar los 400 que han quedado recuperados por reintento (`retries` en los logs) y si alguno sigue fallando, anotar su `<Reason>`"
    acceptance:
      - "La imagen desplegada incluye el reintento de 400 y `status` no muestra fallos nuevos de `entsoe-hourly` por 400"
    refs:
      - "`src/predico50hz/ingest/entsoe/client.py`"
      - "`docs/f1.5-f2.7-operations.md` §7 y §10"

  - id: ops-vm
    title: "Decidir qué hacer con la VM de Hetzner tras G0"
    milestone: v01
    labels: ["tipo:decisión", "area:ops"]
    parent: ops
    blocked_by: [ops-export]
    context: >-
      La VM se creó como efímera para demostrar G0. Pero es el único sitio que archiva sin huecos las
      versiones de ENTSO-E (revisiones) y la hora real de disponibilidad de la NWP: el portátil se apaga y
      ahí un día sin ejecución no se cuenta como fallo. Las medidas de `publication-times` también dependen
      de no perder horas.
    tasks:
      - "Opciones: apagarla; mantenerla como archivo 24/7 hasta la Fase 2; o sustituirla por el sobremesa / TrueNAS"
      - "Valorar coste mensual frente a lo que se pierde (revisiones de ENTSO-E, medidas horarias)"
      - "Si se mantiene: plan de copia de `data/` hacia el NAS"
      - "Dejar la decisión escrita en `docs/f1.5-f2.7-operations.md` §10"
    acceptance:
      - "Decisión documentada y aplicada (VM apagada o con copia de datos programada)"
    refs:
      - "`deploy/hetzner/bootstrap.sh`"

  - id: ops-joberror
    title: "El motivo de los fallos de los jobs llega vacío a `status`"
    milestone: v01
    labels: ["tipo:bug", "area:ops"]
    parent: ops
    context: >-
      `status` muestra `JobError: entsoe prices terminó con código 1:` sin nada detrás de los dos puntos.
      `_run_cli` redirige stderr a un `_Tee` para guardar las últimas líneas, pero la salida con el error
      real no pasa por ahí (el CLI de ENTSO-E escribe el resumen JSON con `errors` en stdout), así que
      `tail` sale vacío. Para ver la causa hubo que leer los logs del contenedor.
    tasks:
      - "Capturar también stdout, o hacer que el CLI devuelva/emita sus `errors` en stderr"
      - "Test que reproduzca un CLI que falla y compruebe que el motivo llega a `runs.jsonl` y a `status`"
    acceptance:
      - "Un fallo de `entsoe-hourly` muestra en `status` el error concreto (p. ej. `HTTP 400: <Reason>…`), sin token"
    refs:
      - "`src/predico50hz/orchestration/jobs.py` (`_Tee`, `_run_cli`)"

  # ── v0.1 · LightGBM extremo a extremo ────────────────────────────────────────────────────────
  - id: v01
    title: "v0.1: LightGBM sin optimizar, extremo a extremo, frente a las cuatro referencias"
    milestone: v01
    labels: ["tipo:puerta", "area:modelo"]
    blocked_by: [f6-lgbm, f5-persistencia, f5-mlflow]
    context: >-
      Primer modelo de verdad sobre los 13 meses de la etapa 2 (sep 2025 – oct 2026), evaluado con el
      mismo marco de backtest que las referencias. No tiene que ganar al operador todavía: tiene que
      funcionar de punta a punta y dejar las métricas registradas.
    tasks:
      - "LightGBM v0.1 evaluado en los 8 pliegues de validación"
      - "Cuatro referencias evaluadas con el mismo módulo de métricas: persistencia, climatología, curva de potencia y operador"
      - "Todo registrado en MLflow"
      - "Actualizar README, `report/model.yaml`, `report/changelog.yaml` y regenerar el informe"
    acceptance:
      - "Scorecard con LightGBM y las cuatro referencias en `data/backtest/report/` y en el informe ejecutivo"
      - "Ejecuciones visibles en MLflow"
    refs:
      - "ADR 0005, ADR 0010 (partición de la v0.1), ADR 0014, ADR 0017"
      - "`docs/f4-backtest.md`"

  - id: f2.5
    title: "F2.5 · Horas de publicación de ENTSO-E (operador, precio y generación)"
    milestone: v01
    labels: ["tipo:epic", "area:entsoe"]
    context: >-
      Tres decisiones del plan dependen de saber cuándo publica ENTSO-E cada dato: si el precio
      day-ahead puede ser variable, contra qué versión del pronóstico del operador hay que compararse, y
      hasta qué hora hay generación real para la persistencia. `entsoe-hourly` mide precio y pronóstico
      cada hora desde el 16 oct.
    tasks:
      - "Sub-issues de esta épica"
    refs:
      - "`docs/f2-entsoe.md` §3"
      - "`docs/f1.5-f2.7-operations.md` §4 (`publication-times`)"

  - id: f2.5-analisis
    title: "Analizar `publication-times` con la primera semana de medidas"
    milestone: v01
    labels: ["area:entsoe"]
    parent: f2.5
    context: >-
      `publication-times` da, por cada día de cierre, la primera hora en que vimos completos el precio
      day-ahead y el pronóstico del operador. La resolución es horaria y es una cota superior. El 16 oct, a
      las 13:20 UTC del día del cierre, el pronóstico del operador aún no estaba publicado.
    tasks:
      - "Ejecutar `publication-times` sobre los datos del servidor (no los del portátil, que tienen huecos)"
      - "Por dataset: hora mediana, peor caso y distribución frente al cierre (13:00/14:00 UTC)"
      - "Documentar el resultado en `docs/f2-entsoe.md` §3"
    acceptance:
      - "Tabla con la hora de publicación del precio y del pronóstico del operador para ≥ 7 cierres, con su margen frente al cierre"
    refs:
      - "`data/ops/publication_times.json`"

  - id: f2.5-generacion
    title: "Medir hasta qué hora hay generación real publicada antes del cierre"
    milestone: v01
    labels: ["area:entsoe", "area:backtest"]
    parent: f2.5
    context: >-
      La referencia de persistencia (F5) necesita saber cuál es el último cuarto de hora de generación real
      que ya está publicado en el momento del cierre. Hoy `entsoe-hourly` solo descarga precio y
      pronóstico, así que no hay medida. Empezar cuanto antes: hacen falta varios días de datos.
    tasks:
      - "Añadir la generación (B18 + B19) a la medición horaria, o una consulta ligera de su último paso publicado"
      - "Extender `publication-times` (o un informe hermano) con el retraso de la generación respecto al tiempo real"
      - "Desplegar en el servidor junto con `ops-deploy` y dejar correr ≥ 7 días"
    acceptance:
      - "Retraso típico y peor caso de la generación publicada a la hora del cierre, documentados en `docs/f2-entsoe.md`"
    refs:
      - "`docs/f4-backtest.md` §9 (persistencia fuera)"

  - id: f2.5-precio
    title: "Decidir si el precio day-ahead entra como variable"
    milestone: v01
    labels: ["tipo:decisión", "area:entsoe", "area:variables"]
    parent: f2.5
    blocked_by: [f2.5-analisis]
    context: >-
      El precio day-ahead de D+1 es una señal de curtailment (precios negativos ⇒ parques parados). La
      subasta SDAC publica hacia las 12:45 CET, muy cerca del cierre de Predico (15:00 CET). Solo puede
      usarse si su hora de publicación medida deja margen suficiente; si no, se podría usar el de D.
    tasks:
      - "Con el análisis de `publication-times`, decidir: precio de D+1, precio de D o ninguno"
      - "Documentar la decisión y el margen en `docs/f3-features.md` §9 (ADR nuevo si cambia lo decidido en el ADR 0009)"
    acceptance:
      - "Decisión escrita; si es afirmativa, el issue de la variable de precio queda desbloqueado; si es negativa, se cierra como no planificado"
    refs:
      - "ADR 0009, ADR 0017"

  - id: f5
    title: "F5 · Referencias completas y registradas en MLflow"
    milestone: v01
    labels: ["tipo:epic", "area:backtest"]
    context: >-
      Ya están evaluadas el operador (RMSE Q50 931 MW), la curva de potencia (1 197 MW) y la climatología
      (3 406 MW) en validación dic 2025 – jul 2026. Faltan la persistencia y el registro en MLflow.
    tasks:
      - "Sub-issues de esta épica"
    acceptance:
      - "Las cuatro referencias evaluadas con el mismo módulo de métricas y registradas en MLflow"
    refs:
      - "ADR 0017"
      - "`src/predico50hz/models/baselines.py`"

  - id: f5-persistencia
    title: "Referencia de persistencia"
    milestone: v01
    labels: ["area:backtest"]
    parent: f5
    blocked_by: [f2.5-generacion]
    context: >-
      Persistencia = repetir para D+1 la última generación conocida antes del cierre (o el perfil del
      último día disponible). Sin saber hasta qué hora hay datos publicados al cierre sería una referencia
      tramposa.
    tasks:
      - "Implementarla como un `Model` más en `models/baselines.py`, usando solo generación con hora de publicación < cierre"
      - "Test anti look-ahead específico"
      - "Evaluarla en los 8 pliegues y añadirla al scorecard"
    acceptance:
      - "Persistencia en el scorecard con RMSE, Winkler y cobertura (si da cuantiles)"
    refs:
      - "`docs/f4-backtest.md` §9"

  - id: f5-mlflow
    title: "Adaptador MLflow para el registro de ejecuciones"
    milestone: v01
    labels: ["area:backtest", "area:calidad"]
    parent: f5
    context: >-
      El marco guarda cada ejecución como `RunRecord` a través de sumideros con un método `save(record)`.
      El adaptador MLflow son unas 10 líneas. STACK.md fija MLflow como seguimiento de experimentos.
    tasks:
      - "Sumidero MLflow: run por `run_id`, parámetros, métricas por pliegue y totales, artefactos (predicciones, PNG)"
      - "Etiquetar cada run con la versión de datos (snapshot de Icechunk y versión Delta del oro)"
      - "Registrar las referencias ya evaluadas"
      - "Documentar cómo abrir la UI en `docs/f4-backtest.md` §7"
    acceptance:
      - "`mlflow ui` muestra las referencias con sus métricas y la versión de datos"
    refs:
      - "`src/predico50hz/evaluation/store.py`"
      - "`docs/f4-backtest.md` §7"

  - id: f6
    title: "F6 · LightGBM con cuantiles, calibración y optimización"
    milestone: v02
    labels: ["tipo:epic", "area:modelo"]
    context: >-
      Q50 con pérdida cuadrática (se puntúa con RMSE, que lo minimiza la media); Q10 y Q90 con pérdida
      cuantílica y calibración conformal (CQR) en ventana móvil de 60 días; orden forzado Q10 ≤ Q50 ≤ Q90.
      Optuna con TPE y poda por mediana. Avanza por fases: v0.1 sin optimizar, CQR para G1, Optuna y
      modelo final para G2.
    tasks:
      - "Sub-issues de esta épica"
    acceptance:
      - "G1 y G2 superadas sobre el periodo reservado"
    refs:
      - "ADR 0014, ADR 0015"

  - id: f6-lgbm
    title: "Modelo LightGBM v0.1 sin optimizar (Q50, Q10, Q90)"
    milestone: v01
    labels: ["area:modelo"]
    parent: f6
    context: >-
      Tres modelos LightGBM con hiperparámetros razonables por defecto sobre la tabla oro (239 variables,
      410 cierres), objetivo `y_cf` (factor de capacidad) y salida en MW con la capacidad del día.
      Partición v0.1: entrenamiento sep 2025 – may 2026, validación jun – jul 2026, reservado ago – 15 oct 2026.
    tasks:
      - "Implementar la interfaz `Model` del marco: Q50 (L2), Q10 y Q90 (cuantílica), con parada temprana"
      - "Forzar el orden Q10 ≤ Q50 ≤ Q90 y recortar a [0, capacidad]"
      - "Semillas fijadas y parámetros registrados"
      - "Evaluar en los 8 pliegues; importancia de variables guardada como artefacto"
      - "Tests: orden de cuantiles, recorte y ausencia de look-ahead en el entrenamiento por pliegue"
    acceptance:
      - "Métricas de LightGBM en el scorecard junto a las referencias"
    refs:
      - "`docs/f3-features.md`, `docs/f4-backtest.md`"

  - id: f8
    title: "F8 · Calidad e ingeniería"
    milestone: v02
    labels: ["tipo:epic", "area:calidad"]
    context: >-
      Hay 276 tests que pasan en local (incluidos los anti look-ahead), pero no hay CI, `tests/integration`
      está vacío, no hay contratos formales entre capas y la reproducibilidad no está probada.
    tasks:
      - "Sub-issues de esta épica"
    acceptance:
      - "Reentrenar desde cero reproduce las métricas registradas con una diferencia < 0,5 %"
    refs:
      - "`docs/historial.md` (F8), STACK.md"

  - id: f8-ci
    title: "Integración continua en GitHub Actions"
    milestone: v01
    labels: ["area:calidad"]
    parent: f8
    context: >-
      El repo ya está en GitHub. Los tests unitarios y anti look-ahead que no necesitan datos deben correr
      en cada push. El commit inicial se hizo sin pasar los hooks de pre-commit, y pyright da errores
      `reportUnknown*` en tests antiguos.
    tasks:
      - "Workflow con uv (Python 3.14): `ruff check`, `ruff format --check`, `pyright`, `pytest` sin los tests que necesitan `data/`"
      - "Marcar los tests que leen datos reales (p. ej. `@pytest.mark.data`) y excluirlos en CI"
      - "`uv run pre-commit run --all-files` limpio; corregir lo que salga"
      - "Dejar pyright sin errores en `tests/` (o acotar su configuración)"
      - "Comprobar que ningún paso del CI necesita secretos"
    acceptance:
      - "Badge verde en `main` y el workflow falla si se rompe un test anti look-ahead"
    refs:
      - "`.pre-commit-config.yaml`, `pyproject.toml`"

  - id: f8-test-env
    title: "Un test de `status` depende del `.env` local"
    milestone: v01
    labels: ["tipo:bug", "area:calidad"]
    parent: f8
    context: >-
      `tests/unit/test_orchestration_ops.py::test_vm_counts_day_without_run_as_failure` falla en el
      portátil porque `.env` tiene `PREDICO_MISSING_IS_FAILURE=false` y `OpsSettings` lo lee. En CI pasaría
      (no hay `.env`), lo que esconde el problema.
    tasks:
      - "Aislar los tests de `.env` y de variables `PREDICO_*` (fixture que limpie el entorno o `_env_file=None`)"
    acceptance:
      - "`uv run pytest tests/unit` pasa en el portátil con el `.env` real"
    refs:
      - "`src/predico50hz/orchestration/settings.py`"

  - id: report-github
    title: "Informe ejecutivo: leer el avance de GitHub en lugar de las marcas de PLAN.md"
    milestone: v01
    labels: ["area:informe"]
    context: >-
      El capítulo «¿Dónde estamos?» del informe lee el avance de las marcas ✅ 🔄 🟡 de PLAN.md. Con el
      seguimiento movido a GitHub, esas marcas dejarán de actualizarse y el informe se quedará atrás.
    tasks:
