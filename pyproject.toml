[project]
name = "predico50hz"
version = "0.1.0"
description = "Predico 50Hertz: pronóstico de precios de electricidad a 50 Hz"
readme = "README.md"
authors = [
    { name = "David Revillas", email = "r3v1@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "cfgrib>=0.9.15.1",
    "deltalake>=1.6.6",
    "dynamical-catalog>=1.0.1",
    "eccodes>=2.50.0",
    "ecmwf-opendata>=0.3.34",
    "entsoe-py>=0.8.1",
    "httpx>=0.28.1",
    "icechunk>=2.3.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "pystac>=1.15.2",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "xarray>=2026.9.0",
    "zarr>=3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "NPY", "PD", "PT", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

# En tests se relaja la inferencia estricta (fixtures, polars/pandas sin tipos completos).
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["src"]
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportPrivateUsage = false
reportArgumentType = false
reportOperatorIssue = false
reportOptionalMemberAccess = false
reportOptionalOperand = false
reportOptionalSubscript = false
reportUnusedImport = false
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "data: necesita datos reales de data/ (se excluye en CI con -m 'not data')",
    "integration: cadena entera ingesta → plata → oro → backtest con datos sintéticos (sin red ni data/)",
]

[tool.coverage.run]
source = ["predico50hz"]

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
