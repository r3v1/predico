name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # cfgrib/eccodes necesitan la librería de sistema ecCodes.
      - name: Instalar ecCodes
        run: sudo apt-get update -q && sudo apt-get install -y -q libeccodes-dev

      # torch viene del índice CUDA (pytorch-cu130): ~4 GB con las libs nvidia y ningún código
      # ni test lo importa todavía. Se omite junto a su cadena CUDA; quitar esta lista cuando
      # se use torch en el código.
      - name: Instalar dependencias
        run: |
          uv sync --locked \
            --no-install-package torch \
            --no-install-package cuda-bindings \
            --no-install-package cuda-pathfinder \
            --no-install-package cuda-toolkit \
            --no-install-package nvidia-cublas \
            --no-install-package nvidia-cuda-cupti \
            --no-install-package nvidia-cuda-nvrtc \
            --no-install-package nvidia-cuda-runtime \
            --no-install-package nvidia-cudnn-cu13 \
            --no-install-package nvidia-cufft \
            --no-install-package nvidia-cufile \
            --no-install-package nvidia-curand \
            --no-install-package nvidia-cusolver \
            --no-install-package nvidia-cusparse \
            --no-install-package nvidia-cusparselt-cu13 \
            --no-install-package nvidia-nccl-cu13 \
            --no-install-package nvidia-nvjitlink \
            --no-install-package nvidia-nvshmem-cu13 \
            --no-install-package nvidia-nvtx

      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Ruff (formato)
        run: uv run --no-sync ruff format --check .

      - name: Pyright (src y tests)
        run: uv run --no-sync pyright

      # Incluye tests/leakage (anti look-ahead): un fallo ahí rompe el CI.
      - name: Tests (sin datos reales)
        run: uv run --no-sync pytest -m "not data"
